<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7EFDC">
<title>KGN Villa</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Place",
  "name": "KGN Villa",
  "url": "https://kgnvilla.in",
  "image": "https://kgnvilla.in/house.jpg",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Jhanda Khurd",
    "addressRegion": "Punjab",
    "postalCode": "151507",
    "addressCountry": "IN"
  },
  "hasMap": "https://www.google.com/maps/search/?api=1&query=M57M%2BW8X,+Jhanda+Khurd,+Punjab+151507"
}
</script>  
<style>
  :root{
    --cream:#FAF3E0;
    --cream-dark:#F0E4C4;
    --gold:#C9A24B;
    --gold-dark:#9C7A2A;
    --gold-light:#E8CF8A;
    --ink:#2B2416;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:Georgia,"Times New Roman",serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  img{max-width:100%}

  /* HERO */
  .hero{
    position:relative;
    height:78vh;
    min-height:480px;
    background:
      linear-gradient(to bottom, rgba(20,15,5,.55) 0%, rgba(20,15,5,.15) 45%, rgba(250,243,224,1) 100%),
      url("house.jpg") center/cover no-repeat;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:max(24px, env(safe-area-inset-top)) 20px 0;
    text-align:center;
  }
  .logo{
    width:clamp(220px, 70vw, 420px);
    height:auto;
    margin-top:8px;
    filter:drop-shadow(0 4px 14px rgba(0,0,0,.45));
    animation:fade 1.2s ease both;
  }
  .hero-text{
    margin-top:auto;
    padding-bottom:28px;
    animation:rise 1.2s .2s ease both;
  }
  .hero-text .welcome{
    font-size:clamp(12px, 2.5vw, 16px);
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--gold-dark);
  }
  .hero-text h1{
    font-size:clamp(38px, 9vw, 72px);
    font-weight:700;
    margin-top:6px;
    letter-spacing:2px;
    /* gold shimmer sweeping across the text */
    background:linear-gradient(110deg,#8a6a1f 0%,#C9A24B 30%,#FFF2B8 50%,#C9A24B 70%,#8a6a1f 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    animation:shimmer 3s linear infinite, glow 2s ease-in-out infinite;
  }
  .hero-text .welcome{animation:blink 2.4s ease-in-out infinite}
  .divider i{animation:twinkle 1.6s ease-in-out infinite}
  .pin{animation:pulse 2s ease-in-out infinite}

  @keyframes shimmer{from{background-position:150% 0}to{background-position:-100% 0}}
  @keyframes glow{
    0%,100%{filter:drop-shadow(0 0 2px rgba(201,162,75,.35))}
    50%{filter:drop-shadow(0 0 12px rgba(232,207,138,.95))}
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes twinkle{
    0%,100%{transform:rotate(45deg) scale(1);box-shadow:0 0 0 rgba(255,230,140,0)}
    50%{transform:rotate(225deg) scale(1.6);box-shadow:0 0 12px rgba(255,230,140,1)}
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 4px 10px rgba(156,122,42,.35)}
    50%{box-shadow:0 0 0 8px rgba(201,162,75,.18),0 4px 16px rgba(201,162,75,.7)}
  }
  .divider{
    display:flex;align-items:center;justify-content:center;
    gap:10px;margin:14px auto 0;width:min(70%, 320px);
  }
  .divider span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .divider i{width:9px;height:9px;background:var(--gold);transform:rotate(45deg);display:block}

  /* CONTENT */
  section{
    max-width:1000px;
    margin:0 auto;
    padding:30px 22px;
  }
  .title{
    text-align:center;
    font-size:clamp(20px, 4vw, 28px);
    color:var(--gold-dark);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:22px;
    align-items:stretch;
  }

  .card{
    background:#FFFBF0;
    border:1.5px solid var(--gold);
    border-radius:18px;
    padding:28px 20px;
    text-align:center;
    box-shadow:0 8px 24px rgba(156,122,42,.18);
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .card::before{
    content:"";position:absolute;inset:6px;
    border:1px solid var(--gold-light);border-radius:13px;pointer-events:none;
  }
  .pin{
    width:50px;height:50px;border-radius:50%;
    margin:0 auto 12px;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    box-shadow:0 4px 10px rgba(156,122,42,.35);
  }
  .card-logo{
    display:block;
    width:clamp(180px, 55%, 300px);
    height:auto;
    margin:0 auto 10px;
  }
  .card h3{font-size:clamp(20px, 3vw, 26px);margin-bottom:8px}
  .card p{font-size:clamp(16px, 2.4vw, 19px);line-height:1.6;color:#4a3f27}

  .btn{
    display:block;
    width:100%;
    max-width:320px;
    margin:20px auto 0;
    padding:15px 20px;
    text-align:center;
    text-decoration:none;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    letter-spacing:1px;
    color:#2B2416;
    background:linear-gradient(135deg,#F0D98C,#C9A24B 55%,#B28A32);
    border-radius:50px;
    box-shadow:0 6px 16px rgba(156,122,42,.4);
    transition:transform .15s, box-shadow .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn:hover{box-shadow:0 8px 22px rgba(156,122,42,.55)}

  .map{
    border:1.5px solid var(--gold);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(156,122,42,.18);
    min-height:260px;
  }
  .map iframe{display:block;width:100%;height:100%;min-height:260px;border:0}

  footer{
    margin-top:10px;
    padding:26px 20px calc(26px + env(safe-area-inset-bottom));
    text-align:center;
    background:linear-gradient(to bottom,var(--cream),var(--cream-dark));
    border-top:1px solid var(--gold-light);
  }
  footer img{width:120px;height:auto;margin-bottom:10px}
  footer p{font-size:13px;color:var(--gold-dark);letter-spacing:1px}

  /* TABLET + DESKTOP */
  @media (min-width:768px){
    .hero{height:88vh;min-height:560px}
    section{padding:50px 32px}
    .grid{grid-template-columns:1fr 1.3fr}
    .card{padding:40px 28px}
    .map{min-height:340px}
    .map iframe{min-height:340px}
  }
  @media (min-width:1200px){
    .hero{height:92vh}
  }
  /* Short landscape phones */
  @media (max-height:500px) and (orientation:landscape){
    .hero{height:auto;min-height:100vh}
  }

  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

  <header class="hero">
    <img class="logo" src="logo.png.png" alt="KGN Villa Logo" data-logo>
    <div class="hero-text">
      <div class="welcome">Welcome to</div>
      <h1>KGN Villa</h1>
      <div class="divider"><span></span><i></i><span></span></div>
    </div>
  </header>

  <section>
    <h2 class="title">Our Address</h2>
    <div class="grid">
      <div class="card">
        <div class="pin">📍</div>
        <img class="card-logo" src="logo.png.png" alt="KGN Villa" data-logo>
        <p>Jhanda Khurd, Punjab,<br>151507, India</p>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.google.com/maps/search/?api=1&query=MM57M+W8X+Jhanda+Khurd+Punjab+151507+India">
           Open in Google Maps
        </a>
      </div>  
      <div class="map">
        <iframe loading="lazy" title="KGN Villa location"
          src="https://www.google.com/maps?q=MM57M+W8X+Jhanda+Khurd+Punjab+151507+India&output=embed"></iframe>
      </div>
    </div>
  </section>

  <footer>
    <p>© KGN Villa · Jhanda Khurd, Punjab</p>
  </footer>

<script>
  // Logo auto-fix: tries common file names/extensions; hides if none found
  (function(){
    var names=["logo.png","logo.jpg","logo.jpeg","logo.webp","Logo.png","Logo.jpg","Logo.jpeg","LOGO.png","LOGO.jpg","logo.PNG","logo.JPG"];
    document.querySelectorAll("img[data-logo]").forEach(function(img){
      var i=0;
      img.onerror=function(){
        i++;
        if(i<names.length){ img.src=names[i]; }
        else { img.onerror=null; img.style.display="none"; }
      };
      img.src=names[0];
    });
  })();
</script>
</body>
</html>
